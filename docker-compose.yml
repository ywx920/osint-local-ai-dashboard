services:
  redis:
    image: redis:7
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment or .env}
      POSTGRES_DB: osintdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./api
      network: host
    
    restart: always
    ports:
      - "${OSINT_BIND_ADDRESS:-127.0.0.1}:7000:7000"
    environment:
      PG_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment or .env}
    depends_on:
      - postgres

  analyzer:
    build:
      context: ./analyzer
      network: host
    
    restart: always
    environment:
      REDIS_HOST: redis
      PG_HOST: postgres
      PG_USER: osint
      PG_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment or .env}
      PG_DB: osintdb
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      OLLAMA_MODEL: qwen2.5:7b
    depends_on:
      - redis
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"

  crawler:
    build:
      context: ./crawler
      network: host
    
    restart: always
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis

volumes:
  pgdata:
